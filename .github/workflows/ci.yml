name: ci

# 태그를 올리기 전에 세 운영체제에서 컴파일과 테스트를 확인한다.
#
# 2.1.1까지 release.yml 은 otpbar-core 와 otpbar-cli 만 검사했다. 정작 트레이와 창을
# 다루는 otpbar-app 은 어느 운영체제에서도 검사되지 않아, Windows 전용 경로
# (`#[cfg(windows)]`)가 깨져도 배포 직전까지 아무도 몰랐다. 이 워크플로가 그 구멍을 막는다.
on:
  push:
    branches: ["main", "fix/**", "feat/**", "chore/**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 검사 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ci-${{ matrix.os }}

      - name: 리눅스 의존성
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      # 앱 크레이트까지 포함한다. 플랫폼별 분기가 깨지면 여기서 걸린다.
      - name: 컴파일 검사 (전체)
        run: cargo check --workspace --all-targets --locked

      - name: 테스트 (전체)
        run: cargo test --workspace --locked

      - name: 서식·린트
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo fmt --all -- --check
          cargo clippy -p otpbar-core -p otpbar-cli --all-targets -- -D warnings
