name: release

# 태그를 올리면 macOS(Apple Silicon·Intel)와 Windows 빌드를 만들고,
# 서명된 업데이트 매니페스트(latest.json)와 함께 릴리스에 올린다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스로 만들 태그 (예: v2.0.0)"
        required: true

jobs:
  test:
    name: 테스트 (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: 리눅스 의존성
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: core·cli 테스트
        run: cargo test -p otpbar-core -p otpbar-cli --locked
      - name: 서식·린트
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo fmt --all -- --check || echo "::warning::cargo fmt 차이가 있습니다"
          cargo clippy -p otpbar-core -p otpbar-cli -- -D warnings

  build:
    name: 빌드 (${{ matrix.target }})
    # 릴리스 자산 업로드에만 쓰기 권한이 필요하다
    permissions:
      contents: write
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: CLI 빌드
        run: cargo build --release -p otpbar-cli ${{ matrix.args }} --locked

      - name: 앱 빌드·서명·릴리스 업로드
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "OTPBar __VERSION__"
          releaseBody: |
            설치 방법은 README를 참고하십시오.

            - macOS: `brew install bamin0422/tap/otpbar`
            - Windows: `irm https://raw.githubusercontent.com/bamin0422/otpbar/main/install.ps1 | iex`
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: CLI 압축 (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path target/release/otp.exe -DestinationPath otp-windows-x86_64.zip -Force
        shell: pwsh

      - name: CLI 압축 (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          tar -czf otp-macos-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release otp

      - name: CLI 업로드
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            otp-windows-x86_64.zip
            otp-macos-${{ matrix.target }}.tar.gz
          fail_on_unmatched_files: false
