[workspace]
resolver = "2"
members = ["crates/otpbar-core", "crates/otpbar-cli", "src-tauri"]

[workspace.package]
version = "2.0.1"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/bamin0422/otpbar"
authors = ["bamin0422"]

[workspace.dependencies]
otpbar-core = { path = "crates/otpbar-core" }

anyhow = "1"
argon2 = "0.5"
base32 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
directories = "5"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "tiff"] }
keyring = "4"
percent-encoding = "2"
rand = "0.8"
rqrr = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
thiserror = "1"
url = "2"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
