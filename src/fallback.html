<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>OTPBar</title>
  <link rel="stylesheet" href="fallback.css">
</head>
<body>
  <header>
    <h1>OTPBar</h1>
    <p class="notice">트레이 아이콘을 만들지 못해 이 창으로 대신 엽니다.</p>
  </header>

  <main>
    <section id="locked" hidden>
      <p>금고가 잠겨 있습니다.</p>
      <button id="unlock" class="primary">잠금 해제</button>
    </section>

    <ul id="list"></ul>
    <p id="empty" class="muted" hidden>등록된 계정이 없습니다.</p>
  </main>

  <footer>
    <p id="status" class="muted" role="status"></p>
    <div class="actions">
      <button id="retry">트레이 다시 시도</button>
      <button id="update">업데이트 확인</button>
    </div>
  </footer>

  <script src="fallback.js"></script>
</body>
</html>
